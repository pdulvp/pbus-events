# Configuration for pbusd.
# Events and listeners live in events.d/ and listeners.d/; they are re-read on
# every incoming event, so they never need a reload.

# Trace level: debug, info, warn or error.
log_level=info

# Log file.
log_file=/var/log/pbus/pbus.log

# Maximum number of commands running at the same time.
max_jobs=16

# Default maximum run time, in seconds, for a triggered command.
default_timeout=900

# Largest payload the daemon will read, in bytes. Anything beyond this is
# dropped from the end, with a line in the log. A payload over 100000 bytes is
# handed to the command on standard input only: the kernel refuses an execve
# whose environment holds a string that long.
max_payload=1048576
